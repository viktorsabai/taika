<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="store.css">
</head>
<body>
<div class="screen">
  <div class="brush" style="left:-80px; top:980px;"></div>
  <div class="mark"><span>tai</span><span class="a">kAAA</span></div>
  <h1>Где тон<br><em>уехал</em></h1>
  <div class="phone"><div class="glass fit">
    <div class="bar"><span>9:41</span><div class="island"></div><span class="r">5G</span></div>
    <div class="appmark"><span>tai</span><span class="a">kAAA</span></div>
    <div class="kicker">СПИКЕР</div>
    <div class="ru">Бронировал номер</div>
    <div class="ph">джонг<span class="arr">→</span> хонг<span class="arr">↘</span></div>
    <div class="th">จองห้อง</div>
    <div class="sec">ПО СЛОГАМ</div>
    <div class="rows">
      <div class="row">
        <div class="top">
          <div class="dot ok"></div>
          <div><div class="name">джонг</div><div class="sub">нужен → <span class="ok">· совпало</span></div></div>
          <div class="score ok">92%</div>
        </div>
        <svg class="spark" viewBox="0 0 940 280">
          <path d="M10 148 C 160 140, 320 156, 480 146 S 720 138, 930 150" fill="none" stroke="#4CD973" stroke-width="5" stroke-linecap="round"/>
        </svg>
        <div class="wave"><i style="height:18px"></i><i style="height:32px"></i><i style="height:52px"></i><i style="height:40px"></i><i style="height:60px"></i><i style="height:34px"></i><i style="height:20px"></i></div>
        <div class="listen">как надо</div>
        <div class="hint">Держи тон ровно, средний.</div>
      </div>
      <div class="line"></div>
      <div class="row">
        <div class="top">
          <div class="dot bad"></div>
          <div><div class="name">хонг</div><div class="sub">нужен ↘ <span class="bad">· было →</span></div></div>
          <div class="score bad">54%</div>
        </div>
        <svg class="spark" viewBox="0 0 940 280">
          <path d="M10 36 C 180 48, 340 120, 520 190 S 760 250, 930 258" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="5" stroke-linecap="round"/>
          <path d="M10 140 C 240 136, 480 148, 930 142" fill="none" stroke="#FA595F" stroke-width="5" stroke-linecap="round"/>
        </svg>
        <div class="hint">Голос шёл ровно — нужен спад в конце.</div>
        <div class="listen">как надо</div>
      </div>
    </div>
    <div class="btn">Говорить</div>
  </div></div>
</div>
</body>
</html>
